<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add('page-loading');</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TitanXGaming - Forgot Password</title>
  <link rel="stylesheet" href="assets/css/style.css?v=1.0.95" />
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="preconnect" href="https://bo.titanxgaming.com" crossorigin>
  <link rel="preconnect" href="https://static.titanxgaming.com" crossorigin>
</head>
<body class="forget-password-page">
  <header class="top-header">
    <div data-layout-section="home-header"></div>
    <div class="logo-box"><img class="site-logo" src="assets/custom/images/logo.png" alt="TitanXGaming" decoding="async" loading="eager" fetchpriority="high"></div>
  </header>

  <main class="forget-password-main">
    <section class="forget-password-card" aria-label="Forgot password panel">
      <div class="forget-password-heading">
        <a class="forget-password-back" href="login.html" aria-label="Back to login"><i class="fa-solid fa-chevron-left"></i></a>
        <h1>FORGOT PASSWORD</h1>
        <span aria-hidden="true"></span>
      </div>

      <form class="forget-password-form" id="forgetPasswordForm" novalidate>
        <p class="forget-password-help">Enter your registered mobile number to receive a verification code.</p>

        <label class="forget-password-field">
          <span class="field-icon"><i class="fa-solid fa-mobile-screen-button"></i></span>
          <input id="forgetMobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="Mobile No." required>
        </label>

        <div class="forget-password-code-row">
          <label class="forget-password-field">
            <span class="field-icon"><i class="fa-solid fa-shield-halved"></i></span>
            <input id="forgetCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Verification Code" required>
          </label>
          <button class="forget-password-code-btn" id="forgetGetCode" type="button">GET CODE</button>
        </div>

        <!-- <label class="forget-password-field">
          <span class="field-icon"><i class="fa-solid fa-lock"></i></span>
          <input id="forgetNewPassword" type="password" autocomplete="new-password" placeholder="New Password (6-20 characters)" minlength="6" maxlength="20" required>
        </label>

        <label class="forget-password-field">
          <span class="field-icon"><i class="fa-solid fa-lock"></i></span>
          <input id="forgetConfirmPassword" type="password" autocomplete="new-password" placeholder="Confirm New Password" minlength="6" maxlength="20" required>
        </label> -->

        <div class="forget-password-message" id="forgetPasswordMessage" role="status" aria-live="polite"></div>
        <button class="forget-password-submit" type="submit">RESET PASSWORD</button>
        <a class="forget-password-login-link" href="login.html">BACK TO LOGIN</a>
      </form>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><img src="assets/custom/images/home.png" alt="HOME" decoding="async" loading="lazy"></a>
    <a href="index.html"><img src="assets/custom/images/history.png" alt="HISTORY" decoding="async" loading="lazy"></a>
    <a href="bonus.html"><img src="assets/custom/images/bonus.png" alt="BONUS" decoding="async" loading="lazy"></a>
    <a href="chat.html"><img src="assets/custom/images/livechat.png" alt="LIVE CHAT" decoding="async" loading="lazy"></a>
    <a href="setting.html"><img src="assets/custom/images/setting.png" alt="SETTING" decoding="async" loading="lazy"></a>
  </nav>

  <script src="assets/js/config.js?v=1.0.26"></script>
  <script src="assets/js/layout-section-loader.js?v=1.1.12"></script>
  <script src="assets/js/site-shell.js?v=1.0.19"></script>
  <script src="assets/js/forget-password.js?v=1.0.0"></script>
  <script src="assets/js/custom-asset-cache.js?v=1.0.19"></script>
  <script src="assets/js/page-loader.js?v=1.0.7"></script>
</body>
</html>
