<!doctype html>
<html lang="en" class="page-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NAGA - Spin 2</title>
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=1.0.93">
  <link rel="stylesheet" href="assets/css/spin2.css?v=1.4.3">
</head>
<body class="spin2-page member-logged-in">
  <header class="spin2-top">
    <button type="button" aria-label="Back" onclick="history.length>1?history.back():location.href='index.html'">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <strong>Lucky Spin</strong>
    <span id="spin2Count">0 Spin</span>
  </header>

  <main class="spin2-main">
    <section class="spin2-stage" aria-label="Lucky Spin wheel">
      <canvas id="spin2Canvas" aria-label="Spin reward wheel"></canvas>
      <img class="spin2-holder" id="spin2Holder" src="assets/images/spin2/holder.png" alt="" aria-hidden="true">
      <div class="spin2-wheel-shadow" id="spin2WheelShadow" aria-hidden="true"></div>
      <img class="spin2-wheel" id="spin2Wheel" src="assets/images/spin2/wheel.png" alt="Reward wheel">
      <img class="spin2-pointer" id="spin2Pointer" src="assets/images/spin2/pointer.png" alt="" aria-hidden="true">
      <button id="spin2Button" class="spin2-button" type="button">SPIN</button>
    </section>

    <aside class="spin2-side-panel">
      <section class="spin2-summary">
        <div class="spin2-summary-head">
          <div>
            <p>My Amount:</p>
            <strong id="spin2MyAmount">MYR0.00</strong>
          </div>
          <button id="spin2Cashout" type="button">Cash Out</button>
        </div>
        <div class="spin2-progress">
          <span id="spin2ProgressBar"></span>
          <em id="spin2ProgressPercent">0%</em>
        </div>
        <div class="spin2-cashout-note" id="spin2CashoutNote">Only <b>MYR 18.00</b> to cash out <strong>MYR 18.00</strong></div>
        <button class="spin2-invite-btn" type="button"><i class="fa-solid fa-share-nodes"></i> <span id="spin2InviteText">Invite Friends To Get Spin</span></button>
      </section>

      <section class="spin2-record-card">
        <div class="spin2-record-tabs" role="tablist">
          <button class="active" type="button" data-spin2-tab="record" aria-selected="true">Record</button>
          <button type="button" data-spin2-tab="helper" aria-selected="false">Helper</button>
        </div>
        <div class="spin2-tab-panel active" data-spin2-panel="record">
          <div id="spin2History" class="spin2-history"></div>
        </div>
        <div class="spin2-tab-panel" data-spin2-panel="helper">
          <div class="spin2-helper-row"><span>🎁</span><div><b>Invite helper</b><small>Invite friends to receive extra free spins.</small></div></div>
        </div>
      </section>

      <div id="spin2Result" class="spin2-result" aria-live="polite">Ready</div>
    </aside>
  </main>

  <div class="spin2-lucky-overlay" id="spin2LuckyOverlay" aria-hidden="true">
    <section class="spin2-lucky-panel" role="dialog" aria-modal="true" aria-label="Choose your lucky bonus">
      <img class="spin2-lucky-logo" src="assets/images/spin/lucky-bonus-en.webp" alt="Lucky Bonus">
      <div class="spin2-lucky-subtitle"><span></span>Choose Your Bonus<span></span></div>
      <div class="spin2-lucky-grid" id="spin2LuckyGrid">
        <button type="button" class="spin2-lucky-box" data-box-index="0" aria-label="Choose bonus box"><img src="assets/images/spin/lucky-box-open-flash.png" alt="Bonus box"><strong></strong></button>
        <button type="button" class="spin2-lucky-box" data-box-index="1" aria-label="Choose bonus box"><img src="assets/images/spin/lucky-box-open-flash.png" alt="Bonus box"><strong></strong></button>
        <button type="button" class="spin2-lucky-box" data-box-index="2" aria-label="Choose bonus box"><img src="assets/images/spin/lucky-box-open-flash.png" alt="Bonus box"><strong></strong></button>
        <button type="button" class="spin2-lucky-box" data-box-index="3" aria-label="Choose bonus box"><img src="assets/images/spin/lucky-box-open-flash.png" alt="Bonus box"><strong></strong></button>
      </div>
      <div class="spin2-lucky-reveal" id="spin2LuckyReveal">
        <img src="assets/images/spin/lucky-box-open-reveal.png" alt="Opened bonus box">
        <strong id="spin2LuckyRevealText">1× Spin</strong>
      </div>
    </section>
  </div>

  <script src="assets/js/config.js?v=1.0.26"></script>
  <script src="assets/js/member-auth.js?v=1.0.14"></script>
  <script src="assets/js/spin2.js?v=1.0.0"></script>
  <script src="assets/js/page-loader.js?v=1.0.7"></script>
</body>
</html>
